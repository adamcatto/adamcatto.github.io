name: Publish staging preview

# Only master may deploy to GitHub Pages, so a push here asks master's deploy
# workflow to rebuild; it builds this branch into /new-version/.
on:
  push:
    branches: [redesign]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref master --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
