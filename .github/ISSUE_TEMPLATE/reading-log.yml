name: Reading log
description: Log a chapter, paper, or essay. It's added to the site's reading log automatically.
title: "Reading log"
labels: ["reading-log"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Chapter
        - Paper
        - Essay
        - Article
        - Other
      default: 1
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "Ch. 3: Bifurcations"
    validations:
      required: true
  - type: input
    id: from
    attributes:
      label: From
      description: The book, journal, or publication it's from.
      placeholder: Nonlinear Dynamics and Chaos
  - type: input
    id: author
    attributes:
      label: Author
  - type: input
    id: link
    attributes:
      label: Link
      placeholder: https://
  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD. Leave blank for today.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional. Markdown works.
